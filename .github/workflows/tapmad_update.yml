name: Tapmad Playlist Auto Update

on:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  update-tapmad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tapmad Script
        run: python Scripts/tapmad_playlist.py

      - name: Commit and Push Tapmad Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tapmad.m3u Tapmad_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto update Tapmad playlist and JSON"
            git push origin main
          else
            echo "No changes to Tapmad.m3u or Tapmad_data.json"
          fi
